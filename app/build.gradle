plugins { id 'com.android.application' }
android {
    namespace 'hu.taks.world'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'hu.taks.world'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.10.0-movement-fix'
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    buildTypes {
        debug { applicationIdSuffix '.realismtest' }
        release { minifyEnabled false }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
