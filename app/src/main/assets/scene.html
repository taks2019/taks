<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#e4eff9;font:14px system-ui;display:flex;flex-direction:column;height:100dvh}#view{flex:1;min-height:160px;position:relative;touch-action:none}canvas{width:100%;height:100%;display:block}#controls{max-height:55%;overflow:auto;padding:9px;background:#172735;display:grid;gap:7px}button,select,input{background:#223c50;color:#edf6ff;border:1px solid #48677f;border-radius:8px;padding:8px;min-width:0}#row,#actions,#motion{display:flex;gap:5px}#row select{flex:1}#fields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}label{font-size:11px;color:#a2c7df}input{width:100%;padding:6px}#status{color:#9bbdd3;font-size:12px;min-height:18px}h2{margin:0;font-size:16px}</style></head><body><div id="view"></div><div id="controls"><h2>TAKS · 3D jelenet</h2><div id="row"><select id="library"></select><button id="add">Hozzáadás</button></div><select id="objects" aria-label="Objektum"></select><div id="fields"><label>X<input id="x" type="number" step=".1"></label><label>Y<input id="y" type="number" step=".1"></label><label>Z<input id="z" type="number" step=".1"></label><label>Forgatás °<input id="rotationY" type="number" step="5"></label><label>Méret<input id="scale" type="number" step=".1" min=".001"></label></div><div id="actions"><button id="apply">Alkalmaz</button><button id="delete">Törlés</button><button id="fit">Középre</button><button id="save">Mentés</button></div><button id="exportGlb">Összeszerelt GLB mentése</button><div id="motion"><select id="clip" aria-label="Animáció" style="flex:1"></select><button id="play">Lejátszás</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label>Növényi hajlás (0–1)<input id="wind" type="range" min="0" max="1" step=".05" value="0"></label><label>Napszak<input id="hour" type="range" min="0" max="23" value="12"></label><label>Szél erőssége<input id="windPower" type="range" min="0" max="1" step=".05" value=".5"></label><label>Animáció sebessége<input id="speed" type="range" min=".25" max="2" step=".25" value="1"></label></div><div id="status">Betöltés…</div></div><script type="module" src="/scene.bundle.js"></script></body></html>
