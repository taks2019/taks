<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script type="module" src="/assets/model-viewer.min.js"></script><style>html,body{margin:0;background:#141b23;color:#dce8f4;height:100%;font:14px sans-serif}model-viewer{width:100%;height:100%;background:radial-gradient(ellipse at 50% 60%,#33495b,#101a24 72%)}#message{position:absolute;left:12px;bottom:8px;pointer-events:none;background:#101820cc;padding:8px;border-radius:8px} #animation{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px}select,button{background:#182735;color:#eaf6ff;border:1px solid #456078;padding:6px;border-radius:6px}select{max-width:65%}</style></head><body><model-viewer id="m" src="/model.glb" camera-controls touch-action="none" shadow-intensity="0.65" exposure="1" camera-orbit="45deg 54.7356deg auto" min-camera-orbit="auto 54.7356deg auto" max-camera-orbit="auto 54.7356deg auto" interaction-prompt="none" autoplay></model-viewer><div id="animation" style="display:none" hidden><select id="clips" aria-label="Animáció"></select><button id="play">Lejátszás</button></div><div id="message">Modell betöltése…</div><script>const m=document.getElementById('m'), t=document.getElementById('message');m.addEventListener('load',()=>{t.textContent='Húzás: forgatás · Két ujj: nagyítás';const clips=m.availableAnimations||[];const bar=document.getElementById('animation'),select=document.getElementById('clips'),play=document.getElementById('play');bar.hidden=!clips.length;bar.style.display=clips.length?'flex':'none';select.replaceChildren(...clips.map(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;return o}));select.onchange=()=>{m.animationName=select.value;m.play();play.textContent='Szünet';};play.onclick=()=>{if(m.paused){m.play();play.textContent='Szünet';}else{m.pause();play.textContent='Lejátszás';}};if(clips.length){m.animationName=clips[0];m.pause();}});m.addEventListener('error',()=>{t.textContent='A GLB nem jeleníthető meg ezen az eszközön.';});</script></body></html>
