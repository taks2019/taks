name: TAKS World / visual approval policy tests
on:
  push:
    branches: ['codex/taks-world-visual-approval-gate-2026-11-20']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-visual-approval-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check that every unapproved or changed asset is blocked
        run: python -m unittest discover -s tests -p 'test_visual_approvals.py' -v
      - name: Verify current assets are not falsely considered owner-approved
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from check_visual_approvals import audit
          ok, reasons = audit(Path("assets/visual_approvals.json"),
                              Path("app/src/main/assets"))
          if ok:
              raise AssertionError("Unreviewed legacy visuals must not be approved")
          assert reasons, "Audit must explain why APK output is blocked"
          print("Correct: APK release remains blocked until individual owner approvals")
          for reason in reasons:
              print(" -", reason)
          PY
