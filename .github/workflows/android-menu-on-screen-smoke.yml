name: TAKS World menu Android emulator real-screen smoke test
on:
  push:
    branches: [codex/taks-world-menu-black-screen-fixed-2026-11-21]
permissions:
  contents: read
  actions: read
jobs:
  screenshot-on-real-android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screenshot inspector
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'
      - name: Retrieve already-built signed APK from exact repair commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/menu-repair-apk
          for attempt in $(seq 1 25); do
            build_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow approved-menu-black-screen-fixed-android.yml --branch "$GITHUB_REF_NAME" --limit 12 --json databaseId,conclusion --jq '[.[] | select(.conclusion=="success")][0].databaseId' 2>/dev/null || true)
            if [[ -n "$build_run" && "$build_run" != "null" ]] && gh run download "$build_run" --repo "$GITHUB_REPOSITORY" --name TAKS_World_Approved_Menu_Fullscreen_Android_Repair --dir /tmp/menu-repair-apk; then
              break
            fi
            echo "Awaiting signed APK build artifact, attempt $attempt"
            sleep 12
          done
          test -s '/tmp/menu-repair-apk/TAKS_WORLD_MENU_JAVITOTT_TESZT.apk'
      - name: Activate virtualization for x86 Android emulator
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Open actual menu and inspect rendered screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          emulator-options: -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p snapshots
            adb install -r '/tmp/menu-repair-apk/TAKS_WORLD_MENU_JAVITOTT_TESZT.apk'
            # Disable one-time Android system popup that previously covered the
            # app and caused a false blank-menu failure.
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb shell am force-stop hu.taks.world.menufixedgame || true
            adb shell am start -n hu.taks.world.menufixedgame/hu.taks.world.MainActivity
            sleep 28
            adb exec-out screencap -p > snapshots/first_frame.png
            # Defensive fallback if the Android system still displays its blue
            # immersive-mode tutorial (it is not part of TAKS World).
            python - <<'PY' > snapshots/immersive_popup
            from PIL import Image
            pic=Image.open('snapshots/first_frame.png').convert('RGB')
            r,g,b=pic.getpixel((pic.width//2,pic.height//3))
            print('yes' if r<50 and 65<g<170 and 90<b<190 else 'no')
            PY
            if grep -q yes snapshots/immersive_popup; then
              python - <<'PY' > snapshots/dismiss_point
            from PIL import Image
            pic=Image.open('snapshots/first_frame.png')
            print(round(pic.width*.64),round(pic.height*.475))
            PY
              read PX PY < snapshots/dismiss_point
              adb shell input tap "$PX" "$PY"
              sleep 10
            fi
            adb exec-out screencap -p > snapshots/menu.png
            adb logcat -d -v time > snapshots/android.log
            python - <<'PY'
            from PIL import Image
            import statistics
            pic=Image.open('snapshots/menu.png').convert('RGB')
            xs=pic.resize((96,54))
            b=[sum(rgb)/3 for rgb in xs.getdata()]
            contrast=statistics.pstdev(b)
            brightness=sum(v>170 for v in b)/len(b)
            print('Real Android MENU',pic.size,'contrast',contrast,'bright pixels',brightness)
            assert contrast>24, 'Menu remains a flat dark background on Android emulator'
            assert brightness>.04, 'Approved original sunlight/stone menu is not visible'
            PY
            python - <<'PY' > snapshots/tap_point
            from PIL import Image
            w,h=Image.open('snapshots/menu.png').size
            scale=min(w/1664,h/768)
            print(round((w-1664*scale)/2+928*scale),
                  round((h-768*scale)/2+385*scale))
            PY
            read X Y < snapshots/tap_point
            adb shell input tap "$X" "$Y"
            sleep 10
            adb exec-out screencap -p > snapshots/gameplay.png
            adb logcat -d -v time > snapshots/android-after-game.log
            python - <<'PY'
            from PIL import Image
            import statistics
            pic=Image.open('snapshots/gameplay.png').convert('RGB')
            b=[sum(p)/3 for p in pic.resize((96,54)).getdata()]
            print('Real Android GAME',pic.size,'contrast',round(statistics.pstdev(b),1))
            PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TAKS_Android_Real_Rendered_Menu_And_Game_Screenshots
          path: snapshots/
          if-no-files-found: warn
          retention-days: 7
