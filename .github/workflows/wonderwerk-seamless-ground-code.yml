name: TAKS World - seam-free natural 3D terrain code verification
on:
  push:
    branches: [codex/taks-world-wonderwerk-seamless-ground-2026-11-21]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terrain-geometry-and-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ OpenGL ES headers and native GLSL validator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgles-dev glslang-tools
      - name: Compile and run cave-safe hill terrain and material regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_natural_seamless_terrain.py' -v
          python3 -m unittest discover -s tests -p 'test_update21_true_3d_terrain.py' -v
      - name: Validate the ACTUAL native 3D renderer source C++ syntax
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -fsyntax-only -Iapp/src/main/cpp app/src/main/cpp/FastScene.cpp
      - name: Compile the ACTUAL Android terrain shader (without generating pictures)
        run: |
          mkdir -p build-check
          python3 - <<'PY'
          from pathlib import Path
          src=Path('app/src/main/cpp/FastScene.cpp').read_text(encoding='utf-8')
          for ident,ext in [('VERT','vert'),('FRAG','frag')]:
              body=src.split('const char* '+ident+'=R"GLSL(',1)[1].split(')GLSL";',1)[0]
              assert body.startswith('#version 300 es')
              Path('build-check/terrain.'+ext).write_text(body,encoding='utf-8')
          PY
          glslangValidator -S vert build-check/terrain.vert
          glslangValidator -S frag build-check/terrain.frag
      - name: Verify only ground work was touched
        run: |
          test -s app/src/main/cpp/WorldTerrain.h
          test -s tests/test_world_terrain_3d.cpp
          grep -q 'loadRealPbrSurface(0,"models/ground_sandy_gravel")' app/src/main/java/hu/taks/world/MainActivity.java
          grep -q 'loadRealPbrSurface(1,"models/wall_cliff_side")' app/src/main/java/hu/taks/world/MainActivity.java
