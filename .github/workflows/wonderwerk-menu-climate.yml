name: TAKS Wonderwerk approved menu climate regression
on:
  push:
    branches:
      - codex/taks-world-elfogadott-menu-mp4-2026-11-19
    paths:
      - 'app/src/main/java/hu/taks/world/MenuClimate.java'
      - 'tests/MenuClimateTest.java'
      - '.github/workflows/wonderwerk-menu-climate.yml'
  workflow_dispatch:
jobs:
  native-climate-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile immutable native weather adapter and regression tests
        run: |
          mkdir -p build/menu-tests
          javac -d build/menu-tests app/src/main/java/hu/taks/world/MenuClimate.java tests/MenuClimateTest.java
      - name: Validate World to UI cause and effect
        run: java -cp build/menu-tests MenuClimateTest
