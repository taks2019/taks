name: TAKS World real human CC0 import assessment
on:
  push:
    branches: [taks-world-realistic-android-test-4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  human-model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare glTF import library without Blender
        run: python -m pip install 'trimesh>=4.10,<5' 'numpy>=1.26,<3' 'Pillow>=10' 'requests>=2.31' 'scipy>=1.11,<2'
      - name: Verify actual UV-mapped CC0 MakeHuman asset geometry
        run: python scripts/import_cc0_human.py
      - name: Show source polygon/material counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('app/src/main/assets/models/makehuman_cc0.tkm')
          b=p.read_bytes()
          assert b[:4]==b'TKM1'
          n=struct.unpack('<I',b[4:8])[0]
          assert n>15000 and len(b)==8+n*32
          assert Path('app/src/main/assets/models/makehuman_cc0.png').is_file()
          print('CC0 UV human verified triangles',n//3)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TAKS-World-real-human-model-assessment
          path: |
            app/src/main/assets/models/makehuman_cc0.tkm
            app/src/main/assets/models/makehuman_cc0.png
          if-no-files-found: warn
