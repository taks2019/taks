name: TAKS World real human CC0 import assessment
on:
  push:
    branches: [taks-world-realistic-android-test-4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  human-model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare glTF import library without Blender
        run: python -m pip install 'trimesh>=4.10,<5' 'numpy>=1.26,<3' 'Pillow>=10' 'requests>=2.31' 'scipy>=1.11,<2'
      - name: Verify actual 53-joint CC0 MakeHuman asset and animation clips
        run: python scripts/import_cc0_rigged_human.py
      - name: Show source skinned-mesh and animation counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          p=Path('app/src/main/assets/models/makehuman_rigged.tks')
          b=p.read_bytes()
          assert b[:4]==b'TKS1'
          _,n,joints,clips=struct.unpack_from('<4sIII',b)
          assert n>30000 and joints==53 and clips==7
          assert Path('app/src/main/assets/models/makehuman_rigged.png').is_file()
          print('CC0 skinned humanoid:',n,'vertices,',joints,'joints,',clips,'clips')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TAKS-World-real-rigged-human-assessment
          path: |
            app/src/main/assets/models/makehuman_rigged.tks
            app/src/main/assets/models/makehuman_rigged.png
            app/src/main/assets/models/makehuman_rigged_source.json
          if-no-files-found: warn
