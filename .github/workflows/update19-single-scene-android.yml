name: TAKS World UPDATE 0.15.4 - SINGLE menu scene + anchored vegetation / water
on:
  push:
    branches: [codex/taks-world-update19-single-scene-wind-2026-11-21]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-android-update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore byte-identical approved 1664x768 original menu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/approved-menu
          gh run download 44632455358 --repo "$GITHUB_REPOSITORY"             --name TAKS-World-Android-First-Playable-APK --dir /tmp/approved-menu
          mkdir -p app/src/main/assets/menu
          unzip -p /tmp/approved-menu/TAKS_World_Android_KIPROBALO.apk             assets/menu/WONDERWERK_APPROVED_WIDE_NO_TEXT.png             > app/src/main/assets/menu/WONDERWERK_APPROVED_WIDE_NO_TEXT.png
          echo "9369d3668b69424d31132e70accbfdb76282d7d9b3f3adfaa51c7c3ca1ea7bc8  app/src/main/assets/menu/WONDERWERK_APPROVED_WIDE_NO_TEXT.png" | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine video and native world build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check             'trimesh>=4.10,<5' 'numpy>=1.26,<3' 'Pillow>=10'             'opencv-python-headless>=4.9,<5' 'requests>=2.31' 'scipy>=1.11,<2'
      - name: Encode genuine animated MP4 - moving leaves ferns water dust sunshine
        run: |
          python scripts/render_approved_wonderwerk_motion.py             --width 1152 --fps 24 --seconds 6
          ffprobe -v error -show_entries             stream=codec_name,width,height,r_frame_rate:format=duration,size             -of default=noprint_wrappers=1             app/src/main/assets/menu/wonderwerk_loop.mp4
      - name: PROTECTED MENU + real motion + playable interior mode tests
        run: |
          python scripts/enforce_taks_update_policy.py
          python -m unittest discover -s tests -p 'test_menu_draw_regression.py' -v
          python -m unittest discover -s tests -p 'test_gameplay_original_menu.py' -v
          python -m unittest discover -s tests -p 'test_update17_mp4_and_gameplay.py' -v
          python -m unittest discover -s tests -p 'test_update19_single_scene.py' -v
      - name: Recover the EIGHT previous Wonderwerk PNG assets byte-for-byte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/wonderwerk_png /tmp/approved_cave_source
          found=0
          for item in \
            'taks-world-0.16.5-native-49:TAKS_World_Android_KIPROBALO.apk' \
            'taks-world-0.15-test-d69847e:TAKS_World_0_15_Android.apk'; do
            tag="${item%%:*}"; filename="${item#*:}"
            rm -f "/tmp/approved_cave_source/$filename"
            if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$filename" --dir /tmp/approved_cave_source; then continue; fi
            valid=1
            for angle in 000 045 090 135 180 225 270 315; do
              if ! unzip -p "/tmp/approved_cave_source/$filename" \
                "assets/wonderwerk_png/$angle.png" > \
                "app/src/main/assets/wonderwerk_png/$angle.png"; then valid=0; break; fi
            done
            if [[ "$valid" == 1 ]] && (cd app/src/main/assets/wonderwerk_png &&
              echo "a3f23343c524c8c0800f59925b573b7106a5deaf52d24fffb83c8454e4e40aa4  000.png"
              echo "90e29d775824caf02bfc70f3c567014ae62eebbe4f18dc1a87491cb51c4ea1a4  045.png"
              echo "c5416aa91340abea64e765e094f173310a17358db4b91ec6af5374bdbb7c653b  090.png"
              echo "e27f97bae6d43ef3c8f497b1031e7a2ee5581ba0d8324fa7c2c6f051ae34626f  135.png"
              echo "a581048a13466401617ea9a045fd9568bf8303f3e2acd9f3bb8a249af7399778  180.png"
              echo "e0874036f0e292bb885d71e1efd134378413336212307e9d240558931f6001dd  225.png"
              echo "285731023fbf0b4108b23c5c3594195d741a53cbed2da0a5dcb7588187faa009  270.png"
              echo "0382f20b62e2caae0e3a784e1d37a2c520480c177263d0b9c837783e894943ff  315.png"
              ) | sha256sum -c -; then
                found=1
                echo "All 8 original cave PNGs restored unchanged"
                break
            fi
          done
          if [[ "$found" != 1 ]]; then
            echo "::error::Approved cave source not available verbatim. NEVER replace with guessed graphics."
            exit 1
          fi
      - name: Import CC0 native terrain rock foliage and rigged actors
        run: |
          python scripts/import_cc0_rocks.py
          python scripts/import_cc0_foliage.py
          python scripts/import_cc0_rigged_human.py
      - name: Native TAKS cause-effect engine tests
        run: |
          cmake -S engine -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --parallel 2
          ctest --test-dir build-native --output-on-failure
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android UPDATE with video and interior view in one APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Validate real APK package identity + MP4 + actual native GLES engine
        run: |
          python scripts/enforce_taks_update_policy.py
          python - <<'PY'
          import zipfile,hashlib
          from pathlib import Path
          path=Path('app/build/outputs/apk/debug/app-debug.apk')
          assert path.is_file() and path.stat().st_size > 8_000_000
          with zipfile.ZipFile(path) as z:
              names=set(z.namelist())
              for n in ('assets/menu/wonderwerk_loop.mp4',
                        'assets/menu/WONDERWERK_APPROVED_WIDE_NO_TEXT.png',
                        'lib/arm64-v8a/libtaks_engine.so','classes.dex'):
                  assert n in names,n
              assert hashlib.sha256(z.read(
                  'assets/menu/WONDERWERK_APPROVED_WIDE_NO_TEXT.png')).hexdigest()==(
                  '9369d3668b69424d31132e70accbfdb76282d7d9b3f3adfaa51c7c3ca1ea7bc8')
              originals={
                '000':'a3f23343c524c8c0800f59925b573b7106a5deaf52d24fffb83c8454e4e40aa4',
                '045':'90e29d775824caf02bfc70f3c567014ae62eebbe4f18dc1a87491cb51c4ea1a4',
                '090':'c5416aa91340abea64e765e094f173310a17358db4b91ec6af5374bdbb7c653b',
                '135':'e27f97bae6d43ef3c8f497b1031e7a2ee5581ba0d8324fa7c2c6f051ae34626f',
                '180':'a581048a13466401617ea9a045fd9568bf8303f3e2acd9f3bb8a249af7399778',
                '225':'e0874036f0e292bb885d71e1efd134378413336212307e9d240558931f6001dd',
                '270':'285731023fbf0b4108b23c5c3594195d741a53cbed2da0a5dcb7588187faa009',
                '315':'0382f20b62e2caae0e3a784e1d37a2c520480c177263d0b9c837783e894943ff'
              }
              for angle,digest in originals.items():
                  key='assets/wonderwerk_png/'+angle+'.png'
                  assert key in names,'MISSING original cave '+key
                  assert hashlib.sha256(z.read(key)).hexdigest()==digest, 'CHANGED '+key
              assert z.getinfo('assets/menu/wonderwerk_loop.mp4').file_size > 100_000
          print('MP4 + gameplay in one UPDATE APK; original menu frozen')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging             app/build/outputs/apk/debug/app-debug.apk | head -n 1
      - name: Stage for local signing WITH the previous actual install's key
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/debug/app-debug.apk delivery/TAKS_WORLD_0_15_4_BUILD_DEBUG_NOT_INSTALLABLE.apk
          cp app/src/main/assets/menu/wonderwerk_loop.mp4 delivery/wonderwerk_loop_24fps.mp4
          echo "This artifact is NOT A VALID IN-PLACE UPDATE until signed with the previous installed APK's exact signing certificate. Keep the original signing key private. Do not uninstall or erase game saves." > delivery/SIGN_WITH_ORIGINAL_KEY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TAKS_World_UPDATE19_SINGLE_SCENE_GAME_BUILD
          path: delivery/
          retention-days: 7
          if-no-files-found: error
