name: TAKS World Android cave roof code validation
on:
  push:
    branches:
      - codex/taks-world-android-roof-cutaway-2026-11-20
  pull_request:
permissions:
  contents: read
jobs:
  causality-and-roof-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile TAKS World engine and roof fade checks
        run: |
          cmake -S engine -B build-roof -DCMAKE_BUILD_TYPE=Release
          cmake --build build-roof --parallel 2
          ctest --test-dir build-roof --output-on-failure
  android-compile-without-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android Java and JNI/C++ renderer compile
        run: gradle --no-daemon :app:compileDebugJavaWithJavac :app:externalNativeBuildDebug --stacktrace
      - name: Explicitly refuse APK artifact before owner-approved graphics
        run: |
          echo 'Android source compiled. No APK generated: visual approvals are pending.'
