name: TAKS World natív Android APK
on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cc0-asset-import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual 3D model import dependencies
        run: python -m pip install --disable-pip-version-check 'trimesh>=4.10,<5' 'numpy>=1.26,<3' 'Pillow>=10' 'requests>=2.31'
      - name: Download and bake real CC0 Poly Haven scanned rock meshes / textures
        run: python scripts/import_cc0_rocks.py
      - name: Publish downloadable offline geometry and texture bundle
        uses: actions/upload-artifact@v4
        with:
          name: TAKS-World-real-CC0-rock-models
          path: app/src/main/assets/models/
          if-no-files-found: error
  native-causality-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C++ ok-okozati motor fordítás
        run: cmake -S engine -B build-native -DCMAKE_BUILD_TYPE=Release
      - name: Natív tesztmotor készítése
        run: cmake --build build-native --config Release --parallel 2
      - name: Oksági tesztek
        run: ctest --test-dir build-native --output-on-failure
  graphics-render-check:
    needs: cc0-asset-import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore real textured CC0 3D geometry into the renderer test
        uses: actions/download-artifact@v4
        with:
          name: TAKS-World-real-CC0-rock-models
          path: app/src/main/assets/models/
      - name: Mesa GLES3 és EGL natív fejlécek
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl-dev libgles-dev libgl1-mesa-dri libpng-dev
      - name: Ugyanannak a háromszög-alapú GLES3 megjelenítőnek a fordítása, mint az APK-ban
        run: |
          mkdir -p build-previews
          g++ -std=c++17 -O2 -Wall -Wextra -Iapp/src/main/cpp \
            tests/fast_scene_preview.cpp app/src/main/cpp/FastScene.cpp app/src/main/cpp/RealModels.cpp \
            -o build-previews/fast_scene_test -lEGL -lGLESv2 -lpng
      - name: GPU alapú izometrikus és 3D kameraforgatási teszt, valódi képekkel
        env:
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          build-previews/fast_scene_test
          python3 tests/ppm_to_png.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TAKS-World-isometric-3D-camera-screenshots
          path: build-previews/*.png
          if-no-files-found: warn
  android-debug-apk:
    needs: [native-causality-tests, cc0-asset-import, graphics-render-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed offline CC0 photo-scanned 3D models and textures in APK
        uses: actions/download-artifact@v4
        with:
          name: TAKS-World-real-CC0-rock-models
          path: app/src/main/assets/models/
      - name: Verify that the complete scanned model package exists
        run: |
          test -s app/src/main/assets/models/rock_07.tkm
          test -s app/src/main/assets/models/rock_07.png
          test -s app/src/main/assets/models/namaqualand_boulders_01.tkm
          test -s app/src/main/assets/models/namaqualand_boulders_01.png
          test -s app/src/main/assets/models/manifest.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - name: Android SDK ellenőrzése
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls -la "${ANDROID_HOME}/cmdline-tools" || true
          find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f -print
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Natív TAKS World debug APK fordítása
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TAKS-World-native-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
