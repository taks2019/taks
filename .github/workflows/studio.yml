name: TAKS Studio Android APK
on:
  push:
    branches: [taks-3d-studio-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle offline 3D viewer
        run: |
          npm install --prefix viewer-deps --no-save --ignore-scripts @google/model-viewer@4.0.0 three@0.172.0 esbuild@0.24.2
          cp viewer-deps/node_modules/@google/model-viewer/dist/model-viewer.min.js app/src/main/assets/
          cp viewer-deps/node_modules/@google/model-viewer/LICENSE app/src/main/assets/model-viewer-LICENSE.txt
          cp studio-web/scene.js viewer-deps/scene.js
          node -e "require(\x27./viewer-deps/node_modules/esbuild\x27).buildSync({entryPoints:[\x27viewer-deps/scene.js\x27],bundle:true,format:\x27esm\x27,minify:true,outfile:\x27app/src/main/assets/scene.bundle.js\x27})"
          cp viewer-deps/node_modules/three/LICENSE app/src/main/assets/three-LICENSE.txt
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build Android APK
        run: |
          gradle --no-daemon :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/TAKS_3D_Studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TAKS_3D_Studio
          path: dist/TAKS_3D_Studio.apk
          retention-days: 7
