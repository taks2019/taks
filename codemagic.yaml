workflows:
  taks-color-android:
    name: TAKS Color Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: taks-color-android
          include: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'TAKS_Color_*_Android_forras.zip'
    environment:
      java: 17
    scripts:
      - &prepare
        name: Extract latest uploaded Android source
        script: |
          set -eu
          cd "$CM_BUILD_DIR"
          SOURCE=$(python3 -c 'import glob,re; a=[(tuple(map(int,re.search(r"_(\d+(?:\.\d+)*)_Android_forras\.zip$",p).group(1).split("."))),p) for p in glob.glob("TAKS_Color_*_Android_forras.zip") if re.search(r"_(\d+(?:\.\d+)*)_Android_forras\.zip$",p)]; assert a,"Upload the source ZIP first"; print(max(a)[1])')
          unzip -tq "$SOURCE"
          mkdir -p taks-color
          unzip -oq "$SOURCE" -d taks-color
          test -f taks-color/app/build.gradle
          cd taks-color
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -x "$SDK/build-tools/35.0.0/apksigner" ]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/taks-gradle.zip
          unzip -oq /tmp/taks-gradle.zip -d /tmp/taks-gradle
      - &build
        name: Build debug APK
        script: |
          set -eu
          cd "$CM_BUILD_DIR/taks-color"
          # Run core Java tests before packaging
          TESTDIR="$(mktemp -d)"
          SRC=app/src/main/java/hu/taks/color
          EXTRA_TEST_SOURCES=()
          if [ -f "$SRC/PlayAssist.java" ]; then EXTRA_TEST_SOURCES+=("$SRC/PlayAssist.java"); fi
          javac -d "$TESTDIR" "$SRC/ContourEdges.java" "$SRC/GalleryPaging.java" "$SRC/MobileRegions.java" "$SRC/ReplayOrder.java" "$SRC/StoryWorld.java" "$SRC/TileGeometry.java" "$SRC/Viewport.java" "${EXTRA_TEST_SOURCES[@]}" tests/*Test.java
          for T in tests/*Test.java; do
            java -Xmx1g -cp "$TESTDIR" "hu.taks.color.$(basename "$T" .java)"
          done
          /tmp/taks-gradle/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp app/build/outputs/apk/debug/app-debug.apk "$CM_BUILD_DIR/artifacts/TAKS_Color.apk"
    artifacts:
      - artifacts/*.apk

  taks-color-cloud:
    name: TAKS Color AI gallery and APK (optional paid generation)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      java: 17
      groups:
        - taks_color_cloud
    scripts:
      - *prepare
      - name: Generate hidden AI artwork
        script: |
          set -eu
          cd "$CM_BUILD_DIR/taks-color"
          bash studio/cloud_build.sh
      - *build
    artifacts:
      - artifacts/*.apk
      - taks-color/app/src/main/assets/cloud_*.takscolor

  taks-color-free-gallery:
    name: TAKS Color - free-license photo gallery and APK
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      java: 17
      vars:
        TAKS_FREE_COUNT: "10"
        TAKS_FREE_SIZE: "2048"
        TAKS_FREE_SEED: "0"
    scripts:
      - *prepare
      - name: Build hidden free-license gallery
        script: |
          set -eu
          cd "$CM_BUILD_DIR/taks-color"
          python3 -m venv .free-venv
          . .free-venv/bin/activate
          python -m pip install -r studio/requirements.txt
          python studio/free_gallery.py --out free-gallery --count "$TAKS_FREE_COUNT" --size "$TAKS_FREE_SIZE" --seed "$TAKS_FREE_SEED" || test "$?" = 2
          python -c 'from pathlib import Path; import shutil; files=sorted(Path("free-gallery").glob("*.takscolor")); assert files, "No free photos retrieved"; [shutil.copy2(p,"app/src/main/assets") for p in files[:10]]'
      - *build
    artifacts:
      - artifacts/*.apk
      - taks-color/free-gallery/*.takscolor
      - taks-color/free-gallery/free-state.json
